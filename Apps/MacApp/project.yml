name: BlueLink
options:
  bundleIdPrefix: dev.bluelink
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  knownRegions:
    - en
    - zh-Hans
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "3"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO

packages:
  BlueLinkCore:
    path: Packages/BlueLinkCore
  MacIntegration:
    path: Platform/MacIntegration
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    version: 2.10.1

targets:
  BlueLink:
    type: application
    platform: macOS
    sources:
      - path: Apps/MacApp/BlueLinkMacApp.swift
      - path: Apps/MacApp/Core
      - path: Apps/MacApp/UI
      - path: Apps/MacApp/Localization
      - path: Apps/MacApp/Assets.xcassets
      - path: Apps/MacApp/AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: Apps/MacApp/Info.plist
      properties:
        CFBundleDisplayName: BlueLink
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSBluetoothAlwaysUsageDescription: "BlueLink connects and disconnects the Bluetooth devices you choose."
        NSHumanReadableCopyright: "MIT License · © 2026 Dylan Liu"
        BlueLinkUpdateRepository: "mentalfl0w/BlueLink"
        SUFeedURL: "https://github.com/mentalfl0w/BlueLink/releases/latest/download/appcast.xml"
        SUPublicEDKey: "ZA+az1CkNnvjCM1YKobsrnREcJWED5smqyNdMXxzZZc="
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bluelink.mac
        PRODUCT_NAME: BlueLink
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: BlueLinkCore
      - package: MacIntegration
      - package: Sparkle
        product: Sparkle
    scheme:
      gatherCoverageData: true
      testTargets:
        - BlueLinkTests

  BlueLinkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Apps/MacApp/Tests
    dependencies:
      - target: BlueLink
      - package: BlueLinkCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bluelink.mac.tests
        GENERATE_INFOPLIST_FILE: YES

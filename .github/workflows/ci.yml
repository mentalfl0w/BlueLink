name: CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (for example 1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build: ${{ steps.metadata.outputs.build }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
            if [[ "$VERSION" == *-* ]]; then
              PRERELEASE=true
            else
              PRERELEASE=false
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            TAG="v${VERSION}"
            PRERELEASE="${{ inputs.prerelease }}"
          else
            VERSION="1.0.0"
            TAG=""
            PRERELEASE=false
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          BUILD="${GITHUB_RUN_NUMBER}"
          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen
          xcodegen version

      - name: Generate project
        run: ./scripts/generate-project.sh

      - name: Package tests
        run: |
          swift test --package-path Packages/BlueLinkCore
          swift test --package-path Platform/MacIntegration

      - name: App tests
        run: |
          xcodebuild \
            -project BlueLink.xcodeproj \
            -scheme BlueLink \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            test

      - name: Boundary checks
        run: ./scripts/boundary-check.sh

      - name: Documentation checks
        run: ./scripts/check-docs.sh

      - name: Package unsigned artifacts
        env:
          BLUELINK_VERSION: ${{ steps.metadata.outputs.version }}
          BLUELINK_BUILD_NUMBER: ${{ steps.metadata.outputs.build }}
        run: ./scripts/package-dmg.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlueLink-unsigned
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    if: needs.build-and-test.outputs.tag != ''
    needs: build-and-test
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: BlueLink-unsigned
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build-and-test.outputs.tag }}
          VERSION: ${{ needs.build-and-test.outputs.version }}
          PRERELEASE: ${{ needs.build-and-test.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            "$TAG"
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
            --title "BlueLink $VERSION"
            --target "$GITHUB_SHA"
            --generate-notes
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
